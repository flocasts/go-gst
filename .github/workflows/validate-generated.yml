name: Validate Generated Code

on:
  pull_request:
    paths:
      - 'gst/**/_gen_*'
      - 'cmd/gst-bindgen/**'
      - 'gir-files/**'
      - 'overrides/**'
  push:
    branches: [main, feature/auto-bindgen]
    paths:
      - 'gst/**/_gen_*'
      - 'cmd/gst-bindgen/**'
      - 'gir-files/**'
      - 'overrides/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build generator
        run: cd cmd/gst-bindgen && go build -o ../../gst-bindgen .

      - name: Regenerate bindings
        run: ./gst-bindgen generate --gir-dir=gir-files/ --output-dir=. --overrides-dir=overrides/

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "ERROR: Generated files are out of date!"
            echo ""
            echo "The following files differ from what the generator produces:"
            git diff --name-only
            echo ""
            echo "Please run 'gst-bindgen generate' and commit the results."
            exit 1
          fi
          echo "All generated files are up to date."

      - name: Run generator tests
        run: cd cmd/gst-bindgen && go test ./...

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            libgstreamer-plugins-bad1.0-dev

      - name: Build all packages
        run: go build ./gst/...

      - name: Vet all packages
        run: go vet ./gst/...
