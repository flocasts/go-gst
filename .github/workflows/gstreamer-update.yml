name: Detect GStreamer Update

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'GStreamer version to update to (leave empty for auto-detect)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Detect latest GStreamer version
        id: version
        run: |
          CURRENT=$(cat gir-files/VERSION)

          if [ -n "${{ inputs.version }}" ]; then
            LATEST="${{ inputs.version }}"
          else
            # Query GStreamer monorepo tags via GitLab API.
            # Filter for stable releases (even minor version, X.Y.Z format).
            LATEST=$(curl -sf "https://gitlab.freedesktop.org/api/v4/projects/gstreamer%2Fgstreamer/repository/tags?per_page=100&search=1." \
              | python3 -c "
          import json, sys, re
          tags = json.load(sys.stdin)
          releases = []
          for t in tags:
              m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', t['name'])
              if m and int(m.group(2)) % 2 == 0:
                  releases.append(t['name'])
          releases.sort(key=lambda v: list(map(int, v.split('.'))), reverse=True)
          print(releases[0] if releases else '')
          ")
          fi

          if [ -z "$LATEST" ]; then
            echo "::error::Failed to detect latest GStreamer version from GitLab API"
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date ($CURRENT)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version available: $CURRENT -> $LATEST"
          fi

      - name: Install build dependencies
        if: steps.version.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config flex bison \
            python3-pip \
            libglib2.0-dev libgudev-1.0-dev libssl-dev \
            libcairo2-dev libxml2-dev libjpeg-dev libopenjp2-7-dev \
            libsoup2.4-dev libjson-glib-dev \
            gobject-introspection libgirepository1.0-dev \
            libasound2-dev libpango1.0-dev \
            libnice-dev libsrtp2-dev
          sudo pip3 install meson ninja

      - name: Build GStreamer ${{ steps.version.outputs.latest }}
        if: steps.version.outputs.changed == 'true'
        run: |
          # Clone the GStreamer monorepo at the exact tagged version and build
          # from source with introspection enabled to produce GIR files.
          git clone --depth 1 --branch "${{ steps.version.outputs.latest }}" \
            https://gitlab.freedesktop.org/gstreamer/gstreamer.git /tmp/gstreamer_src

          cd /tmp/gstreamer_src
          meson setup builddir --prefix=/usr \
            -Dintrospection=enabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dgst-examples=disabled \
            -Ddoc=disabled \
            -Dgtk_doc=disabled \
            -Dgpl=enabled \
            -Dlibav=disabled \
            -Dpython=disabled \
            -Dvaapi=disabled \
            -Dsharp=disabled \
            -Dges=disabled \
            -Ddevtools=disabled \
            -Dwebrtc=enabled \
            -Dgst-plugins-bad:dtls=enabled \
            -Dgst-plugins-bad:sctp=enabled \
            -Dgst-plugins-bad:srtp=enabled \
            -Dlibnice=enabled
          meson compile -C builddir
          sudo meson install -C builddir

      - name: Set up Go
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build generator
        if: steps.version.outputs.changed == 'true'
        run: cd cmd/gst-bindgen && go build -o ../../gst-bindgen .

      - name: Save old generated files
        if: steps.version.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/old-gst
          cp -r gst/ /tmp/old-gst/

      - name: Update GIR files
        if: steps.version.outputs.changed == 'true'
        run: |
          GIR_SRC="/usr/share/gir-1.0"
          MISSING=0
          for f in gir-files/*.gir; do
            BASENAME=$(basename "$f")
            if [ -f "$GIR_SRC/$BASENAME" ]; then
              cp "$GIR_SRC/$BASENAME" "gir-files/$BASENAME"
            else
              echo "::warning::GIR file not found in build output: $BASENAME"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING GIR file(s) missing from the GStreamer build"
            echo "Check that the Meson build options enable all required subprojects."
            exit 1
          fi
          echo "${{ steps.version.outputs.latest }}" > gir-files/VERSION

      - name: Regenerate bindings
        if: steps.version.outputs.changed == 'true'
        run: |
          ./gst-bindgen generate --gir-dir=gir-files/ --output-dir=. --overrides-dir=overrides/

      - name: Determine update kind
        id: semver
        if: steps.version.outputs.changed == 'true'
        run: |
          OLD="${{ steps.version.outputs.current }}"
          NEW="${{ steps.version.outputs.latest }}"
          OLD_MAJOR=$(echo "$OLD" | cut -d. -f1)
          NEW_MAJOR=$(echo "$NEW" | cut -d. -f1)
          OLD_MINOR=$(echo "$OLD" | cut -d. -f2)
          NEW_MINOR=$(echo "$NEW" | cut -d. -f2)

          if [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
            echo "kind=major" >> "$GITHUB_OUTPUT"
          elif [ "$OLD_MINOR" != "$NEW_MINOR" ]; then
            echo "kind=minor" >> "$GITHUB_OUTPUT"
          else
            echo "kind=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for API breaking changes
        id: api-check
        if: steps.version.outputs.changed == 'true'
        run: |
          # Run check-api; exit code 2 = breaking changes found, 0 = none.
          set +e
          ./gst-bindgen check-api \
            --old-dir=/tmp/old-gst \
            --new-dir=. \
            --old-version="${{ steps.version.outputs.current }}" \
            --new-version="${{ steps.version.outputs.latest }}" \
            --format=text
          API_EXIT=$?
          set -e

          if [ "$API_EXIT" -eq 2 ]; then
            echo "has_breaking=true" >> "$GITHUB_OUTPUT"
          elif [ "$API_EXIT" -eq 0 ]; then
            echo "has_breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "API check failed with exit code $API_EXIT"
            exit 1
          fi

          # Generate markdown report for PR body.
          ./gst-bindgen check-api \
            --old-dir=/tmp/old-gst \
            --new-dir=. \
            --old-version="${{ steps.version.outputs.current }}" \
            --new-version="${{ steps.version.outputs.latest }}" \
            --format=markdown > /tmp/api-report.md 2>/dev/null || true

          {
            echo "report<<APIDIFF_EOF"
            cat /tmp/api-report.md
            echo "APIDIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if minor/patch has breaking changes
        if: |
          steps.version.outputs.changed == 'true' &&
          steps.semver.outputs.kind != 'major' &&
          steps.api-check.outputs.has_breaking == 'true'
        run: |
          echo "::error::Breaking changes detected in a ${{ steps.semver.outputs.kind }} GStreamer update (${{ steps.version.outputs.current }} -> ${{ steps.version.outputs.latest }})"
          echo ""
          echo "Minor/patch releases must not introduce breaking changes to the Go API."
          echo ""
          cat /tmp/api-report.md
          echo ""
          echo "Please investigate whether:"
          echo "  1. The GIR file changes are intentional upstream"
          echo "  2. The generator has a bug producing different output"
          echo "  3. The overrides need adjustment to preserve the API"
          exit 1

      - name: Create Pull Request
        if: steps.version.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Update bindings for GStreamer ${{ steps.version.outputs.latest }}"
          branch: "auto/gstreamer-${{ steps.version.outputs.latest }}"
          body: |
            Automated update of GStreamer bindings from `${{ steps.version.outputs.current }}` to `${{ steps.version.outputs.latest }}`.

            **Update type:** `${{ steps.semver.outputs.kind }}`

            ## API Changes

            ${{ steps.api-check.outputs.has_breaking == 'true' && '> :warning: **This update contains breaking changes.** Review carefully before merging.' || '> :white_check_mark: No breaking API changes detected.' }}

            <details>
            <summary>Full API diff report</summary>

            ${{ steps.api-check.outputs.report }}

            </details>

            ## Changes
            - Updated GIR files from GStreamer ${{ steps.version.outputs.latest }} (built from source)
            - Regenerated Go bindings using `gst-bindgen generate`

            ## Verification
            - [ ] `go build ./gst/...` compiles
            - [ ] `go test ./gst/...` passes
            - [ ] `go vet ./gst/...` has no warnings
          commit-message: "Update bindings for GStreamer ${{ steps.version.outputs.latest }}"
          delete-branch: true
          labels: |
            automated
            ${{ steps.api-check.outputs.has_breaking == 'true' && 'breaking-change' || '' }}

      - name: Clean up
        if: always()
        run: |
          rm -f gst-bindgen
          rm -rf /tmp/gstreamer_src /tmp/old-gst
